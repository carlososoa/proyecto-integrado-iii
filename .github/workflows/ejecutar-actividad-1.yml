name: Ejecutar Actividad 1

# Se ejecuta en cada push a main: vuelve a correr el notebook desde cero y
# guarda el .txt generado, para que el repositorio siempre muestre resultados
# que salieron de la última versión del código.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ejecutar-actividad-1
  cancel-in-progress: false

jobs:
  notebook:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install nbconvert ipykernel

      - name: Ejecutar el notebook
        working-directory: EA1/notebooks
        run: |
          jupyter nbconvert \
            --to notebook \
            --execute \
            --inplace \
            --ExecutePreprocessor.timeout=1200 \
            EA1_carga_y_transformacion.ipynb

      - name: Publicar resultados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add EA1/notebooks EA1/resultados

          if git diff --cached --quiet; then
            echo "Sin cambios."
            exit 0
          fi

          git commit -m "chore: actualizar resultados de la Actividad 1 [skip ci]"
          git push origin HEAD:main
